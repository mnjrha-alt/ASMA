<style>
:root{--bg:#05030f;--card:rgba(22,14,52,.55);--tx:#f3ecff;--ac:#ff3d9a;--ac2:#35e0ff;--gold:#f5d28a;--bd:rgba(180,140,255,.3)}
[data-theme=light]{--bg:#f7f1ff;--card:rgba(255,255,255,.72);--tx:#25103f;--ac:#d6246e;--ac2:#6a3cff;--gold:#a8741a;--bd:rgba(106,60,255,.28)}
*{box-sizing:border-box;margin:0;font-family:'Tajawal',Tahoma,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;transition:background .5s}
body::before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 20% 20%,#ff3d9a55,transparent),radial-gradient(45% 45% at 80% 30%,#35e0ff40,transparent),radial-gradient(50% 50% at 50% 90%,#7a3cff55,transparent);animation:aur 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:46px 46px;opacity:.28;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
@keyframes aur{to{transform:translate(4%,6%) rotate(8deg) scale(1.1)}}
@keyframes fi{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.8}}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg)}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:auto;z-index:5}
.screen.on{display:flex;animation:fi .6s}
#splash{background:#000;z-index:99}
#splash h1{font:900 clamp(2.6rem,13vw,4.5rem) Arial;color:#ff1030;letter-spacing:6px;margin-top:30px;text-shadow:0 0 8px #ff1030,0 0 22px #ff1030,0 0 50px #ff0020,0 0 90px #ff0020;animation:pulse 1.6s infinite ease-in-out;direction:ltr}
.ld{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.ld img{width:164px;height:164px;border-radius:50%;object-fit:cover;object-position:50% 30%;box-shadow:0 0 18px #ff1030}
.ld::before{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid transparent;border-top-color:#ff1030;border-right-color:#ff1030;filter:drop-shadow(0 0 8px #ff1030) drop-shadow(0 0 18px #ff0020);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:24px;width:min(440px,100%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 20px 60px -25px var(--ac)}
h2{margin-bottom:14px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea,button{font-size:1rem;border-radius:16px;border:1px solid var(--bd);padding:13px;width:100%;margin:6px 0;background:rgba(255,255,255,.08);color:var(--tx);outline:0;text-align:center}
input:focus,textarea:focus{box-shadow:0 0 14px var(--ac2);border-color:var(--ac2)}
button{cursor:pointer}
.btn{background:linear-gradient(135deg,var(--ac),#7a3cff);color:#fff;border:0;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 24px var(--ac)}
.lnk{background:none;border:0;color:var(--ac2);font-size:.9rem}
.row{display:flex;gap:8px}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts i{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.45;filter:drop-shadow(0 0 6px var(--ac))}
#app{position:fixed;inset:0;display:none;z-index:2}
.page{display:none;height:100%;overflow:auto;padding:22px 16px 110px;text-align:center}
.page.on{display:block;animation:fi .5s}
.page>*{max-width:480px;margin-inline:auto}
.ft{margin-top:40px;font-size:.7rem;opacity:.6;line-height:1.8}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);z-index:20}
nav button{width:auto;flex:1;border:0;background:none;font-size:.7rem;padding:6px 2px;margin:0;opacity:.6;transition:.25s}
nav button b{display:block;font-size:1.5rem}
nav button.on{opacity:1;color:var(--ac2);transform:translateY(-5px);text-shadow:0 0 14px var(--ac2)}
.big{font-size:4rem;animation:pulse 1.3s infinite}
#box{white-space:pre-line;text-shadow:0 0 10px #f5d28a66;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;line-height:2;color:var(--gold);margin-bottom:12px}
.circle{width:170px;height:170px;border-radius:50%;overflow:hidden;margin:12px auto;border:3px solid var(--ac2);box-shadow:0 0 30px var(--ac),0 0 60px -10px var(--ac2);background:#0003;display:flex;align-items:center;justify-content:center;font-size:3rem}
.circle img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform .15s}
.note{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px auto;text-align:start;cursor:pointer;transition:.2s;display:block}
.note:hover{transform:translateY(-3px);box-shadow:0 8px 30px -12px var(--ac)}
.note small{display:block;opacity:.65;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:20px;border-radius:10px;background:#0005;overflow:hidden;margin:14px 0}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gold),var(--ac2));transition:width 1.5s}
#lp{min-height:60px;font-size:1.1rem;line-height:2;color:var(--gold)}
.gear{position:fixed;top:14px;left:14px;width:48px;height:48px;padding:0;border-radius:50%;font-size:1.4rem;z-index:30;display:none;background:var(--card);backdrop-filter:blur(10px)}
#set{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#set.on{display:flex}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-140px);max-width:92vw;background:linear-gradient(135deg,var(--ac),#7a3cff);color:#fff;padding:14px 22px;border-radius:24px;z-index:300;transition:.5s;box-shadow:0 0 30px var(--ac);text-align:center;font-weight:700}
#toast.e{background:linear-gradient(135deg,#ff1744,#7a0030)}
#toast.on{transform:translateX(-50%)}
#bday{position:fixed;inset:0;background:radial-gradient(#ff3d9a,#1a0030);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:150;text-align:center;color:#fff;font-size:2rem;padding:20px;overflow:hidden}
#bday.on{display:flex}
.acc{display:flex;align-items:center;gap:12px;padding:10px;margin:8px 0;border-radius:18px;background:var(--card);border:1px solid var(--bd);cursor:pointer;text-align:start}
.acc img,.acc span{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#0004;display:flex;align-items:center;justify-content:center}
.emo{font-size:1.6rem;letter-spacing:6px;margin-bottom:8px}
#ed{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;background:var(--bg)}
#ed.on{display:flex;animation:fi .3s}
#ed .bar{display:flex;gap:8px;padding:12px;align-items:center;border-bottom:1px solid var(--bd)}
#ed .bar button{width:auto;margin:0;padding:10px 16px}
#ed .bar b{flex:1;text-align:center}
#etx{flex:1;margin:0;border-radius:0;border:0;text-align:start;resize:none;font-size:1.1rem;line-height:2.2rem;padding:18px;background:repeating-linear-gradient(transparent,transparent calc(2.2rem - 1px),var(--bd) calc(2.2rem - 1px),var(--bd) 2.2rem)}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div id="toast"></div>
<div class="screen on" id="splash"><div class="ld"><img id="sp" alt=""></div><h1>M.SY</h1></div>

<div class="screen" id="s-login"><div class="card">
<div class="emo">🌸💖✨🎀</div><h2 data-i="loginT"></h2>
<input id="name" data-p="name" maxlength="20" autocomplete="off">
<div style="margin-top:10px;opacity:.85" data-i="birthT"></div>
<div class="row" dir="ltr"><input id="bd" inputmode="numeric" maxlength="2" placeholder="DD"><input id="bm" inputmode="numeric" maxlength="2" placeholder="MM"><input id="by" inputmode="numeric" maxlength="4" placeholder="YYYY"></div>
<button class="btn" id="go" onclick="doAuth()" data-i="go1"></button></div></div>

<div id="app">
<button class="gear" id="gear" onclick="set.classList.add('on')">⚙️</button>
<div class="page on" id="p-home"><div class="big">💖</div><h2 id="hello"></h2><div class="card" data-i="homeTxt" style="line-height:2"></div></div>
<div class="page" id="p-flirt"><h2 data-i="flirtT"></h2>
<div class="card" id="box">💕</div><div class="card"><div data-i="pressTxt"></div><button class="btn" onclick="flirt()">❤</button><button id="cp" onclick="copyF()" data-i="copyB" style="display:none"></button></div></div>
<div class="page" id="p-love"><h2 data-i="loveT"></h2><div class="card"><div class="big" id="pct">?</div><div class="meter"><div id="mt"></div></div><div id="lp"></div><button class="btn" onclick="love()" data-i="measure"></button></div></div>
<div class="page" id="p-diary"><h2 data-i="diaryT"></h2><button class="btn" onclick="openEd(null)" data-i="addMem"></button><div id="notes"></div></div>
<div class="page" id="p-queen"><h2 data-i="queenT"></h2><div class="card"><p data-i="queenTxt"></p><small data-i="soon"></small></div></div>
<div class="page" id="p-profile"><h2 data-i="profT"></h2><div class="circle" id="pimg"></div>
<div class="card" id="pinfo" style="text-align:start;line-height:2.2"></div>
<button class="btn" onclick="logout()" style="margin-top:14px" data-i="logout"></button></div>
<nav id="nav"></nav></div>

<div id="ed"><div class="bar"><button onclick="closeEd()">➡️</button><b data-i="edT"></b><button id="edel" onclick="delEd()">🗑</button><button class="btn" onclick="saveEd()" data-i="save"></button></div>
<textarea id="etx" data-p="edPh"></textarea></div>

<div id="set"><div class="card"><h2 data-i="setT"></h2>
<button onclick="setLang()" data-i="langB"></button>
<button onclick="setTheme()" data-i="themeB"></button>
<button class="btn" onclick="set.classList.remove('on')" data-i="close"></button></div></div>

function logA(a){if(!cur)return;cur.log=cur.log||[];cur.log.push({a,t:new Date().toLocaleString()});if(cur.log.length>300)cur.log.shift();save()}
for(let i=0;i<18;i++){const h=document.createElement('i');h.textContent=['💖','✦','🌸','💗'][i%4];h.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*20}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*12}s`;$('hearts').appendChild(h)}
document.querySelectorAll('.page').forEach(p=>p.insertAdjacentHTML('beforeend','<div class="ft" data-i="ft"></div>'));
// auth
function doAuth(){const n=$('name').value.trim(),d=+$('bd').value,m=+$('bm').value,y=+$('by').value;
if(n.length<2)return toast('bad',1);
if(!(d>0&&d<32&&m>0&&m<13&&y>1900&&y<2100))return toast('bdBad',1);
let a=accts.find(x=>x.name.toLowerCase()==n.toLowerCase());
if(!a){a={name:n,bd:d,bm:m,by:y,notes:[],log:[],created:new Date().toLocaleString()};accts.push(a)}else{a.bd=d;a.bm=m;a.by=y}
cur=a;save();enter()}
function enter(){put('msy_session',cur.name);logA('دخول / login');show('splash');setTimeout(openApp,2200)}
function openApp(){$('splash').classList.remove('on');$('app').style.display='block';applyAll();go('home');bdayCheck()}
async function logout(){logA('خروج / logout');toast('bye');await sleep(1800);LS.removeItem('msy_session');cur=null;show('splash');setTimeout(()=>{$('name').value='';show('s-login')},2000)}
// pages
function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$('p-'+p).classList.add('on');$('p-'+p).scrollTop=0;
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.pg==p));
$('gear').style.display=p=='profile'?'block':'none';if(p=='profile'&&cur)renderProfile();
$('pct').textContent='?';$('mt').style.width='0';$('lp').innerHTML='';$('box').innerHTML='💕';$('cp').style.display='none';logA('page: '+p)}
const N='اســـمـــا',D=['🌹','💖','✨','🌸','👑','💫','🦋','🌙','💎','🎀'];
const OR=[['꧁༺','༻꧂'],['❖━━','━━❖'],['✦•┈┈','┈┈•✦'],['❀⋆','⋆❀'],['⋆｡°✩','✩°｡⋆'],['⊱✿⊰','⊱✿⊰'],['•°¯••','••¯°•'],['❥','❥'],['【','】'],['☆彡','彡☆']];
const FL={full:['{n}، إنتِ الاسم اللي بيخلّي قلبي يعزف على كل حرف فيه 🎶','لو الجمال كان بحر، كنتِ إنتِ الموجة اللي بتغرّقني كل يوم 🌊','يا {n}، كل ما أشوف اسمك بتنوّر الدنيا كلها حولي ✨','ما بعرف شو سحرتيني فيه، بس بعرف إنو ما بدي أفيق منه 💫','ضحكتك يا {n} بتصلّح أسوأ يوم بحياتي 😍','أنا مبرمج وبعرف أصلّح كل الأخطاء، إلا خطأ إني حبيتك.. ما بدي أصلّحه أبداً 💻❤️','قلبي كود بسيط: while(true){ أحبك({n}); } 💗','عيونك يا {n} وطن، وأنا بدي أعيش فيه العمر كله 🌙','بين كل الناس، قلبي اختارك إنتِ وما ندم 🌹','إنتِ مش بس حلوة، إنتِ الحلا كله لما اجتمع بإنسانة وحدة 🍯','كل أغاني الحب بتذكرني فيكِ يا {n} 🎧','{n}، وجودك بحياتي أحلى هدية ما كنت أتوقعها 🎁','لو كل النجوم انطفت، بكفيني نور عيونك 🌟','قربك بيخلّيني أنسى التعب، وبعدك بيخلّيني أعدّ الثواني ⏳','يا {n}، إنتِ القصيدة اللي ما بتخلص، وأنا شاعرها المتيّم 📜','ملكة قلبي واسمها {n}، والباقي كله رعايا 👑','كل يوم بحبك أكتر من أمس، وأقل من بكرا 💞','لو الحب جريمة، أنا أول واحد بيعترف وبيطلب تشديد العقوبة 😂❤️','إنتِ القهوة اللي بتصحّيني، والدفا اللي بيضمّني ☕','خلّيكِ دايماً قريبة، لأنو الدنيا من دونك مش دنيا 🌍','يا {n}، يا أحلى صدفة خلّتني أصدّق بالقدر 🎀'],
a:['يا اسما','يا قمري','يا روحي','يا حبيبتي','يا نور عيوني','يا ملكتي','يا عمري','يا دنيتي','يا حياتي','يا أميرتي','يا قلبي','يا سكّر','يا شريكة عمري','يا أحلى اسما'],
b:['وجودك بحياتي','ضحكتك','طيبة قلبك','إطلالتك','حنانك','كلامك','عيونك','حضورك','دعواتك','قربك','أخلاقك','صوتك','طلتك','اسمك'],
c:['أحلى من كل الورد','هدية من ربي','أجمل صدفة بعمري','أغلى من الذهب','أكبر نعمة بحياتي','ما إله مثيل بالكون','أحلى شي بهالدنيا','سر سعادتي','أحلى من الشعر والأغاني','أصفى من نور القمر','أدفى من حضن الشتا','أروع من كل الأحلام'],
e:['بحبك كتير يا اسما','بحبك فوق ما بتتخيلي','إنتِ الأجمل دايماً','يسلمو هالعيون','الله يخليكِ إلي','وقلبي كله إلك']};
let lastF='';
function flirt(){let s;do{const o=R(OR),body=Math.random()<.45?R(FL.full).replace(/\{n\}/g,N):R(FL.a).replace('اسما',N)+'\n'+R(FL.b)+' '+R(FL.c)+(Math.random()<.6?'\n'+R(FL.e).replace('اسما',N):'');
s=o[0]+' '+R(D)+' '+o[1]+'\n'+body+'\n'+o[0]+' '+R(D)+' '+o[1]}while(s==lastF);
lastF=s;const b=$('box');b.textContent=s;b.style.animation='none';void b.offsetWidth;b.style.animation='fi .5s';$('cp').style.display='block';logA('flirt')}
async function copyF(){try{await navigator.clipboard.writeText(lastF)}catch(e){const x=document.createElement('textarea');x.value=lastF;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}toast('copied')}
function love(){const p=Math.random()<.15?0:70+Math.floor(Math.random()*31);$('pct').textContent=(p?'💗 ':'💔 ')+p+'%';$('mt').style.width='0';setTimeout(()=>$('mt').style.width=p+'%',50);
if(!p){$('lp').innerHTML=t('l0')[0];setTimeout(()=>{if($('pct').textContent.includes(' 0%'))$('lp').innerHTML+='<br>'+t('l0')[1]},1800)}
else $('lp').innerHTML=R(t('l'+(p<80?1:p<90?2:p<100?3:4)));logA('love '+p+'%')}
// diary
function openEd(id){eid=id;const n=cur.notes.find(x=>x.id==id);$('etx').value=n?n.b:'';$('edel').style.display=n?'':'none';$('ed').classList.add('on');$('etx').focus()}
function closeEd(){$('ed').classList.remove('on')}
async function saveEd(){const v=$('etx').value.trim();if(!v)return toast('empty',1);
if(eid){const n=cur.notes.find(x=>x.id==eid);n.b=v;n.u=Date.now()}else cur.notes.unshift({id:Date.now(),b:v,u:Date.now()});
save();closeEd();renderNotes();toast('saved');logA('memory saved')}
async function delEd(){cur.notes=cur.notes.filter(x=>x.id!=eid);save();closeEd();renderNotes();logA('memory deleted')}
function renderNotes(){$('notes').innerHTML=cur.notes.length?cur.notes.map(n=>{const l=n.b.split('\n');return `<div class="note" onclick="openEd(${n.id})"><b>💭 ${esc(l[0].slice(0,40))}</b><small>${esc(l.slice(1).join(' ')||'')}</small><small>${new Date(n.u).toLocaleString()}</small></div>`}).join(''):`<div class="card" style="margin-top:14px">${t('none')}</div>`}
function renderProfile(){$('pimg').innerHTML=`<img src="${PHOTO}">`;
$('pinfo').innerHTML=`<div>👤 ${t('nm')}<b>${esc(cur.name)}</b></div><div>🎂 ${t('bdl')}<b>${esc(cur.bd)}/${esc(cur.bm)}/${esc(cur.by)}</b></div>`}
function bdayCheck(){const n=new Date(),k=n.toDateString();if(cur.bd==n.getDate()&&cur.bm==n.getMonth()+1&&get('msy_bd','')!=k+cur.name){put('msy_bd',k+cur.name);$('bt').textContent=t('bday');$('bday').classList.add('on');
for(let i=0;i<40;i++){const c=document.createElement('i');c.textContent=R(['🎉','🎈','💖','✨','🎂']);c.style.cssText=`position:absolute;bottom:-30px;left:${Math.random()*100}%;font-size:28px;animation:up ${5+Math.random()*6}s linear infinite`;$('bday').appendChild(c)}
$('bday').onclick=()=>$('bday').classList.remove('on')}}
// boot
applyAll();
const ss=get('msy_session',null);cur=accts.find(a=>a.name==ss)||null;
setTimeout(()=>{if(cur){logA('فتح الموقع / opened');openApp()}else show('s-login')},2000);
</script>
</body>
</html>
